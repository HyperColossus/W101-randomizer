[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w101-randomizer"
version = "0.1.0"
description = "Offline seed and progression planner for a Wizard101 private-server randomizer"
requires-python = ">=3.10"

[project.scripts]
w101-randomizer = "randomizer.cli:main"

[tool.setuptools.packages.find]
include = ["randomizer*"]
