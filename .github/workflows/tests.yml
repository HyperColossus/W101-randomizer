name: Randomizer tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test seed, curation, progression, persistence and bridge
        run: python -m unittest discover -s tests -v
      - name: Smoke-test demo manifest generator
        run: |
          python -m randomizer.cli generate --catalog config/example_catalog.json --settings config/example_settings.json --out out/example-manifest.json
          python -m randomizer.cli progress --catalog config/example_catalog.json --manifest out/example-manifest.json --state state/example.json --character ci-demo --level 10
  dotnet-bridge-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build standalone bridge library
        run: dotnet build integration/ImlightBridge/ImlightBridge.csproj --configuration Release --nologo
